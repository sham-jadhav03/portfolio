<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a857a"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3451f"/>
    </marker>
  </defs>

  <!-- layer groupings -->
  <rect x="15" y="104" width="570" height="60" rx="10" fill="#3a3a36" fill-opacity="0.05"/>
  <rect x="0" y="176" width="600" height="118" rx="10" fill="#3a3a36" fill-opacity="0.05"/>
  <text x="30" y="115" font-size="6.5" letter-spacing="1.2" fill="#8a857a">APPLICATION LAYER</text>
  <text x="15" y="187" font-size="6.5" letter-spacing="1.2" fill="#8a857a">DATA &amp; EXTERNAL SERVICES</text>

  <!-- connectors (drawn first, under nodes) -->
  <g fill="none" stroke="#8a857a" stroke-width="1.2">
    <path d="M300,48 V60" marker-end="url(#arrow)"/>
    <path d="M300,90 V104 H120 V118" marker-end="url(#arrow)"/>
    <path d="M120,148 V165 H150 V182" marker-end="url(#arrow)"/>
    <path d="M300,148 V165 H260 V182" marker-end="url(#arrow)"/>
    <path d="M90,148 V200 H70 V252" marker-end="url(#arrow)"/>
    <path d="M202,212 V248" marker-end="url(#arrow)"/>
  </g>

  <g fill="none" stroke="#b3451f" stroke-width="1.3">
    <path d="M300,90 V118" marker-end="url(#arrow-accent)"/>
    <path d="M370,133 H430" marker-end="url(#arrow-accent)"/>
    <path d="M490,148 V220 H395 V252" marker-end="url(#arrow-accent)"/>
    <path d="M510,148 V225 H530 V252" marker-end="url(#arrow-accent)"/>
  </g>

  <!-- edge labels -->
  <g font-size="7" fill="#8a857a">
    <text x="128" y="108">auth</text>
    <text x="308" y="108">chat</text>
    <text x="378" y="128" font-size="6.5">SSE / Streaming</text>
    <text x="58" y="215">verifies</text>
  </g>

  <!-- User -->
  <circle cx="300" cy="35" r="13" fill="#fff" stroke="#3a3a36" stroke-width="1.3"/>
  <text x="300" y="38" font-size="8" text-anchor="middle" fill="#1a1a17">User</text>

  <!-- Client App -->
  <g>
    <rect x="215" y="60" width="170" height="30" rx="5" fill="#fff" stroke="#3a3a36" stroke-width="1.2"/>
    <text x="300" y="79" font-size="9.5" text-anchor="middle" fill="#1a1a17">Client App</text>
  </g>

  <!-- Auth Service -->
  <g>
    <rect x="35" y="118" width="140" height="30" rx="5" fill="#fff" stroke="#3a3a36" stroke-width="1.2"/>
    <text x="105" y="137" font-size="9.5" text-anchor="middle" fill="#1a1a17">Auth Service</text>
  </g>

  <!-- Chat Service -->
  <g>
    <rect x="230" y="118" width="140" height="30" rx="5" fill="#fff" stroke="#b3451f" stroke-width="1.2"/>
    <text x="300" y="137" font-size="9.5" text-anchor="middle" fill="#1a1a17">Chat Service</text>
  </g>

  <!-- AI Research Engine -->
  <g>
    <rect x="430" y="118" width="140" height="30" rx="5" fill="#fff" stroke="#b3451f" stroke-width="1.2"/>
    <text x="500" y="137" font-size="9.5" text-anchor="middle" fill="#1a1a17">AI Research Engine</text>
  </g>

  <!-- Data Layer -->
  <g>
    <rect x="92" y="182" width="220" height="30" rx="5" fill="#fff" stroke="#3a3a36" stroke-width="1.2"/>
    <text x="202" y="201" font-size="9.5" text-anchor="middle" fill="#1a1a17">Persistence Layer</text>
  </g>

  <!-- MongoDB (cylinder) -->
  <g>
    <path d="M155,254 a45,7 0 0 1 90,0 v30 a45,7 0 0 1 -90,0 z" fill="#fff" stroke="#3a3a36" stroke-width="1.2"/>
    <ellipse cx="200" cy="254" rx="45" ry="7" fill="#fff" stroke="#3a3a36" stroke-width="1.2"/>
    <text x="200" y="278" font-size="9" text-anchor="middle" fill="#1a1a17">MongoDB</text>
  </g>

  <!-- Email Provider -->
  <g>
    <rect x="10" y="252" width="120" height="30" rx="5" fill="#fff" stroke="#3a3a36" stroke-width="1.2"/>
    <text x="70" y="271" font-size="8.5" text-anchor="middle" fill="#1a1a17">Email Provider</text>
  </g>

  <!-- Search API -->
  <g>
    <rect x="340" y="252" width="110" height="30" rx="5" fill="#fff" stroke="#3a3a36" stroke-width="1.2"/>
    <text x="395" y="271" font-size="8.5" text-anchor="middle" fill="#1a1a17">Tavily Search</text>
  </g>

  <!-- LLM Providers -->
  <g>
    <rect x="470" y="252" width="120" height="30" rx="5" fill="#fff" stroke="#3a3a36" stroke-width="1.2"/>
    <text x="530" y="269" font-size="8.5" text-anchor="middle" fill="#1a1a17">LLM Providers</text>
    <text x="530" y="279" font-size="6.5" text-anchor="middle" fill="#8a857a">Gemini · Mistral</text>
  </g>
</svg>