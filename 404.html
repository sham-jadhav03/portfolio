<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Ghansham Jadhav</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f7f4ed;
            --ink: #17150f;
            --ink-soft: #5d584c;
            --accent: #b3451f;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #100f0e;
                --ink: #f0ece2;
                --ink-soft: #9b958a;
                --accent: #e8703f;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: "JetBrains Mono", monospace;
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 32px;
        }
        .mono {
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }
        h1 {
            font-family: "Instrument Serif", serif;
            font-weight: 400;
            font-size: clamp(4rem, 15vw, 9rem);
            line-height: 0.9;
            letter-spacing: -0.02em;
        }
        h1 em { font-style: italic; color: var(--accent); }
        p { margin-top: 18px; }
        a { color: var(--accent); }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
        .back { margin-top: 36px; }
    </style>
</head>
<body>
    <main>
        <p class="mono">Error 404</p>
        <h1>Page<br><em>missing</em></h1>
        <p class="mono">The page you're looking for doesn't exist.</p>
        <div class="back mono">
            <a href="./">← Back to home</a>
        </div>
    </main>
</body>
</html>
